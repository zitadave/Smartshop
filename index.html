<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Smart Shop Ethiopia — Premium Marketplace</title>
    <meta name="title" content="Smart Shop Ethiopia — Premium Marketplace" />
    <meta name="description" content="Ethiopia's premier e-commerce marketplace. Discover curated products at exceptional prices with complimentary delivery." />
    <meta name="theme-color" content="#1a365d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Smart Shop Ethiopia" />
    <meta property="og:description" content="Discover curated products at exceptional prices." />
    <meta property="og:image" content="/icons/icon-512x512.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.svg" />
    <script>
      (function() {
        try {
          var ver = 'v38';
          if (localStorage.getItem('ss_app_version') !== ver) {
            localStorage.setItem('ss_app_version', ver);
          }
        } catch(e) {}

        // ===== COLLECT USER DATA =====
        // Priority 1: Telegram.WebApp (injects automatically in Mini App WebView)
        // Priority 2: URL query params (passed by bot after contact sharing)
        
        var profile = {};
        try { profile = JSON.parse(localStorage.getItem('ss_profile') || '{}'); } catch(e) {}

        // Try Telegram.WebApp
        try {
          var tg = window.Telegram?.WebApp;
          if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            var u = tg.initDataUnsafe.user;
            tg.ready();
            tg.expand();
            profile.telegramId = String(u.id || '');
            if (u.username) profile.telegramUsername = u.username;
            if (u.first_name && !profile.name) profile.name = u.first_name;
            if (!profile.joinedAt) profile.joinedAt = new Date().toISOString();
            profile.registered = true;
            localStorage.setItem('ss_profile', JSON.stringify(profile));
            localStorage.setItem('ss_tg_detected', 'true');
            
            // Fetch phone
            fetch('/api/user/contact?telegram_id=' + profile.telegramId)
              .then(function(r) { return r.json(); })
              .then(function(d) {
                if (d && d.phone) {
                  var p = JSON.parse(localStorage.getItem('ss_profile') || '{}');
                  p.phone = d.phone;
                  localStorage.setItem('ss_profile', JSON.stringify(p));
                  localStorage.setItem('ss_user_phone', d.phone);
                  localStorage.setItem('ss_phone_shared', 'true');
                }
              }).catch(function() {});
            return; // Telegram detected - no need for URL params
          }
        } catch(e) {}

        // Fallback: Read URL query params (passed by bot after contact sharing)
        try {
          var params = new URLSearchParams(window.location.search);
          var tgId = params.get('tg_id');
          if (tgId) {
            profile.telegramId = tgId;
            if (params.get('username')) profile.telegramUsername = params.get('username');
            if (params.get('name')) profile.name = params.get('name');
            if (params.get('phone')) {
              profile.phone = params.get('phone');
              localStorage.setItem('ss_user_phone', params.get('phone'));
              localStorage.setItem('ss_phone_shared', 'true');
            }
            if (!profile.joinedAt) profile.joinedAt = new Date().toISOString();
            profile.registered = true;
            localStorage.setItem('ss_profile', JSON.stringify(profile));
            localStorage.setItem('ss_tg_detected', 'true');
            
            // Clean URL - remove query params after saving
            window.history.replaceState({}, document.title, window.location.pathname);
          }
        } catch(e) {}

        // If we have telegramId but no phone, try fetching from API
        if (profile.telegramId && !profile.phone) {
          fetch('/api/user/contact?telegram_id=' + profile.telegramId)
            .then(function(r) { return r.json(); })
            .then(function(d) {
              if (d && d.phone) {
                var p = JSON.parse(localStorage.getItem('ss_profile') || '{}');
                p.phone = d.phone;
                localStorage.setItem('ss_profile', JSON.stringify(p));
                localStorage.setItem('ss_user_phone', d.phone);
                localStorage.setItem('ss_phone_shared', 'true');
              }
            }).catch(function() {});
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
