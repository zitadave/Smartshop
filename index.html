<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Smart Shop Ethiopia — Premium Marketplace</title>
    <meta name="title" content="Smart Shop Ethiopia — Premium Marketplace" />
    <meta name="description" content="Ethiopia's premier e-commerce marketplace. Discover curated products at exceptional prices with complimentary delivery." />
    <meta name="theme-color" content="#1a365d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Smart Shop Ethiopia" />
    <meta property="og:description" content="Discover curated products at exceptional prices." />
    <meta property="og:image" content="/icons/icon-512x512.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.svg" />

    <script>
      // Step 1: Version check - DON'T clear all data, just tag it
      (function() {
        try {
          var ver = 'v24';
          var old = localStorage.getItem('ss_app_version');
          if (old !== ver) {
            localStorage.setItem('ss_app_version', ver);
            // Only clear the old detection flag
            try { localStorage.removeItem('ss_tg_detected'); } catch(e) {}
          }
        } catch(e) {}
      })();

      // Step 2: Telegram detection - runs immediately AND schedules retries
      (function detectTelegram() {
        try {
          if (window.Telegram && window.Telegram.WebApp) {
            var wa = window.Telegram.WebApp;
            wa.ready();
            wa.expand();
            var user = wa.initDataUnsafe && wa.initDataUnsafe.user;
            if (user) {
              var profile = {};
              try { profile = JSON.parse(localStorage.getItem('ss_profile') || '{}'); } catch(e) {}
              profile.telegramId = String(user.id || '');
              if (user.username) profile.telegramUsername = user.username;
              if (user.first_name && !profile.name) profile.name = user.first_name;
              if (!profile.joinedAt) profile.joinedAt = new Date().toISOString();
              profile.registered = true;
              localStorage.setItem('ss_profile', JSON.stringify(profile));
              localStorage.setItem('ss_tg_detected', 'true');
              // Fetch phone in background
              fetch('/api/user/contact?telegram_id=' + profile.telegramId)
                .then(function(r) { return r.json(); })
                .then(function(d) {
                  if (d && d.phone) {
                    var p = JSON.parse(localStorage.getItem('ss_profile') || '{}');
                    p.phone = d.phone;
                    localStorage.setItem('ss_profile', JSON.stringify(p));
                    localStorage.setItem('ss_user_phone', d.phone);
                    localStorage.setItem('ss_phone_shared', 'true');
                  }
                }).catch(function() {});
              return true;
            }
          }
        } catch(e) {}
        return false;
      })();

      // Step 3: Retry detection up to 20 times over 4 seconds (non-blocking)
      (function() {
        var attempts = 0;
        function retry() {
          if (detectTelegram()) return;
          attempts++;
          if (attempts < 20) setTimeout(retry, 200);
        }
        setTimeout(retry, 0);  // Retry immediately after synchronous code
        setTimeout(retry, 100);
        setTimeout(retry, 300);
        setTimeout(retry, 700);
        setTimeout(retry, 1500);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
